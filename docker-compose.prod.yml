version: '3.8'

services:
  # ==============================================================================
  # 1. Custom Enterprise Client Tier
  # ==============================================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: aegis_web_client
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://api:8000/api/v1
    depends_on:
      - api

  # ==============================================================================
  # 2. Custom Application Gateway Tier
  # ==============================================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aegis_api_gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - RAGFLOW_BASE_URL=http://ragflow:9380/api/v1
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:-dev_ragflow_api_key}
    depends_on:
      - ragflow

  # ==============================================================================
  # 3. Foundational RAG Engine Tier (RAGFlow Subsystem)
  # ==============================================================================
  ragflow:
    image: infiniflow/ragflow:v0.16.0-slim
    container_name: aegis_ragflow_engine
    restart: always
    ports:
      - "9380:9380"
    environment:
      - DOC_ENGINE=infinity
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=rag_flow
      - MYSQL_USER=rag_flow
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-rag_flow_secure_pass}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=${MINIO_ACCESS_KEY:-ragflow_minio}
      - MINIO_PASSWORD=${MINIO_SECRET_KEY:-ragflow_minio_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ragflow_redis_pass}
      - INFINITY_HOST=infinity
      - INFINITY_PORT=23817
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  infinity:
    image: infiniflow/infinity:v0.5.0
    container_name: aegis_infinity_db
    restart: always
    ports:
      - "23817:23817"
    volumes:
      - infinity_data:/var/infinity

  mysql:
    image: mysql:8.0
    container_name: aegis_mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secure_pass}
      - MYSQL_DATABASE=rag_flow
      - MYSQL_USER=rag_flow
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-rag_flow_secure_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: aegis_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-ragflow_minio}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-ragflow_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: aegis_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-ragflow_redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ragflow_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  infinity_data:
  mysql_data:
  minio_data:
  redis_data:
